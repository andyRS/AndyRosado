<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Workflow de Clara en n8n para Club Esperanza</title>
  <desc id="desc">Vista pública saneada del flujo: webhook de WhatsApp, extracción, deduplicación, control de estado, clasificación del mensaje, agente de inteligencia artificial, envío de respuesta, filtro de anuncio y registro del lead.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f14"/><stop offset="1" stop-color="#111c27"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      .node{fill:#18212c;stroke:#334155;stroke-width:2;rx:18;filter:url(#shadow)}
      .trigger{stroke:#22d3ee}.decision{stroke:#f59e0b}.action{stroke:#a78bfa}.success{stroke:#34d399}.muted{fill:#101720;stroke:#263445}
      .line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .support{fill:none;stroke:#8b5cf6;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .label{font:700 18px Manrope,Arial,sans-serif;fill:#f4f7fa}.small{font:500 14px Manrope,Arial,sans-serif;fill:#94a3b8}.eyebrow{font:700 15px 'Roboto Mono',monospace;letter-spacing:2px;fill:#22d3ee}.title{font:800 34px Manrope,Arial,sans-serif;fill:#f4f7fa}.tag{font:700 13px 'Roboto Mono',monospace;fill:#0b0f14}.yes{fill:#34d399}.no{fill:#f59e0b}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="eyebrow">N8N · WORKFLOW ACTIVO</text>
  <text x="70" y="116" class="title">Clara — atención de WhatsApp y captación desde anuncios</text>
  <text x="70" y="148" class="small">Arquitectura pública saneada · sin credenciales, teléfonos ni URLs privadas</text>

  <path class="line" d="M230 245H270"/><path class="line" d="M430 245H470"/><path class="line" d="M630 245H670"/><path class="line" d="M830 245H870"/><path class="line" d="M1030 245H1070"/><path class="line" d="M1230 245H1270"/>
  <rect class="node trigger" x="70" y="195" width="160" height="100"/><text class="label" x="150" y="232" text-anchor="middle">Webhook</text><text class="small" x="150" y="258" text-anchor="middle">mensaje entrante</text>
  <rect class="node" x="270" y="195" width="160" height="100"/><text class="label" x="350" y="232" text-anchor="middle">Extraer datos</text><text class="small" x="350" y="258" text-anchor="middle">mensaje original</text>
  <rect class="node" x="470" y="195" width="160" height="100"/><text class="label" x="550" y="232" text-anchor="middle">Deduplicar</text><text class="small" x="550" y="258" text-anchor="middle">message_id</text>
  <rect class="node" x="670" y="195" width="160" height="100"/><text class="label" x="750" y="230" text-anchor="middle">Consultar</text><text class="label" x="750" y="254" text-anchor="middle">estado</text><text class="small" x="750" y="277" text-anchor="middle">panel admin</text>
  <rect class="node decision" x="870" y="195" width="160" height="100"/><text class="label" x="950" y="232" text-anchor="middle">¿Clara activa?</text><text class="small" x="950" y="258" text-anchor="middle">interruptor operativo</text>
  <rect class="node decision" x="1070" y="195" width="160" height="100"/><text class="label" x="1150" y="232" text-anchor="middle">¿Es texto?</text><text class="small" x="1150" y="258" text-anchor="middle">clasificar entrada</text>
  <rect class="node action" x="1270" y="195" width="230" height="100"/><text class="label" x="1385" y="232" text-anchor="middle">AI Agent</text><text class="small" x="1385" y="258" text-anchor="middle">respuesta contextual</text>
  <rect class="yes" x="1042" y="222" width="42" height="22" rx="11"/><text class="tag" x="1063" y="238" text-anchor="middle">SÍ</text>

  <path class="line" d="M950 295V360H845"/><rect class="muted" x="665" y="330" width="180" height="80" rx="16"/><text class="label" x="755" y="365" text-anchor="middle">Finalizar</text><text class="small" x="755" y="389" text-anchor="middle">sin respuesta automática</text><rect class="no" x="920" y="307" width="42" height="22" rx="11"/><text class="tag" x="941" y="323" text-anchor="middle">NO</text>
  <path class="line" d="M1150 295V360H1115"/><rect class="node" x="935" y="330" width="180" height="80"/><text class="label" x="1025" y="365" text-anchor="middle">Aviso de formato</text><text class="small" x="1025" y="389" text-anchor="middle">solo texto</text><rect class="no" x="1120" y="307" width="42" height="22" rx="11"/><text class="tag" x="1141" y="323" text-anchor="middle">NO</text>

  <path class="support" d="M1285 490V305"/><path class="support" d="M1480 490V305"/>
  <rect class="node action" x="1190" y="450" width="190" height="80"/><text class="label" x="1285" y="485" text-anchor="middle">Gemini</text><text class="small" x="1285" y="509" text-anchor="middle">hasta 3 intentos</text>
  <rect class="node action" x="1390" y="450" width="160" height="80"/><text class="label" x="1470" y="485" text-anchor="middle">Memoria</text><text class="small" x="1470" y="509" text-anchor="middle">contexto breve</text>

  <path class="line" d="M1385 295V590H1230"/><path class="line" d="M1230 640H1190"/><path class="line" d="M1010 640H970"/>
  <rect class="node success" x="1190" y="590" width="210" height="100"/><text class="label" x="1295" y="627" text-anchor="middle">Enviar respuesta</text><text class="small" x="1295" y="653" text-anchor="middle">WhatsApp Cloud API</text>
  <rect class="node decision" x="1010" y="590" width="180" height="100"/><text class="label" x="1100" y="627" text-anchor="middle">¿Vino de anuncio?</text><text class="small" x="1100" y="653" text-anchor="middle">referral verificable</text>
  <rect class="node success" x="760" y="590" width="210" height="100"/><text class="label" x="865" y="627" text-anchor="middle">Registrar lead</text><text class="small" x="865" y="653" text-anchor="middle">panel · sin duplicar</text><rect class="yes" x="978" y="617" width="42" height="22" rx="11"/><text class="tag" x="999" y="633" text-anchor="middle">SÍ</text>
  <path class="line" d="M1100 690V745H970"/><rect class="muted" x="790" y="715" width="180" height="70" rx="16"/><text class="label" x="880" y="757" text-anchor="middle">No registrar</text><rect class="no" x="1072" y="702" width="42" height="22" rx="11"/><text class="tag" x="1093" y="718" text-anchor="middle">NO</text>

  <rect x="70" y="590" width="600" height="195" rx="20" fill="#0f151d" stroke="#263445" stroke-width="2"/>
  <text x="100" y="627" class="eyebrow">RAMA DE VERIFICACIÓN DE META</text>
  <path class="line" d="M250 700H290"/><path class="line" d="M450 700H490"/>
  <rect class="node trigger" x="100" y="655" width="150" height="90"/><text class="label" x="175" y="691" text-anchor="middle">Webhook GET</text><text class="small" x="175" y="715" text-anchor="middle">challenge</text>
  <rect class="node decision" x="290" y="655" width="160" height="90"/><text class="label" x="370" y="691" text-anchor="middle">Verificar token</text><text class="small" x="370" y="715" text-anchor="middle">validación</text>
  <rect class="node success" x="490" y="635" width="150" height="58"/><text class="label" x="565" y="670" text-anchor="middle">Responder</text>
  <rect class="muted" x="490" y="708" width="150" height="58" rx="16"/><text class="label" x="565" y="743" text-anchor="middle">Rechazar</text>

  <circle cx="90" cy="842" r="7" fill="#22d3ee"/><text class="small" x="106" y="847">Entrada / webhook</text><circle cx="260" cy="842" r="7" fill="#f59e0b"/><text class="small" x="276" y="847">Decisión</text><circle cx="385" cy="842" r="7" fill="#a78bfa"/><text class="small" x="401" y="847">IA / soporte</text><circle cx="530" cy="842" r="7" fill="#34d399"/><text class="small" x="546" y="847">Acción verificada</text>
  <text x="1530" y="847" class="small" text-anchor="end">Club Esperanza · arquitectura revisada 30/09/2026</text>
</svg>
