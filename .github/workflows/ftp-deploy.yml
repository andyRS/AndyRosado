name: Deploy to Hostgator via FTP

on:
  workflow_dispatch: {}
  # Auto-deploy on push to gh-pages is temporarily disabled until the live
  # Hostgator site content (contact.php, leads/, phpmailer/, favicons, etc.)
  # is reconciled with this repo, to avoid overwriting it with stale files.
  # push:
  #   branches:
  #     - gh-pages

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            SCREENSHOTS_NEEDED.md
